services:
  - type: web
    name: shipvera-backend
    env: node
    plan: free
    region: singapore # Closest low-latency region to India
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SARVAM_API_KEY
        sync: false # Set in Render Dashboard
      - key: SARVAM_AGENT_ID
        sync: false # Set in Render Dashboard (create agent in Sarvam dashboard)
      - key: SARVAM_PHONE_NUMBER_ID
        sync: false # Set in Render Dashboard (rent/attach number in Sarvam dashboard)
      - key: SARVAM_VOICE_AGENT_DISPATCH_URL
        sync: false # Only after confirming the outbound endpoint in Sarvam docs/dashboard
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
