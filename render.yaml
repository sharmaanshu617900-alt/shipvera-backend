services:
  - type: web
    name: shipvera-backend
    env: node
    plan: free
    region: singapore # Closest low-latency region to India
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: BOLNA_API_KEY
        sync: false # Set in Render Dashboard
      - key: BOLNA_AGENT_ID
        sync: false # Set in Render Dashboard
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
